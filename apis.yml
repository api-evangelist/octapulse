name: Octapulse
description: >-
  Octapulse (OctaPulse) is a Y Combinator (Winter 2026) startup applying computer
  vision and robotics to automate quality inspection in finfish farms. Its AI
  vision platform integrates into existing aquaculture workflows starting at the
  hatchery stage, using off-the-shelf cameras to perform broodstock phenotyping
  and juvenile deformity detection. The system reduces per-fish inspection time
  from roughly five minutes to under thirty seconds while achieving over 90%
  accuracy, standardizing QA processes and building proprietary multi-species
  datasets for the aquaculture industry. At this stage Octapulse is an early
  hardware-and-vision product company with no public API, developer portal, or
  programmatic surface; this profile tracks it as a lead in the API Evangelist
  network for future enrichment should a developer platform emerge.
